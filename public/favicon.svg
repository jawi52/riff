<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Emerald to Electric Cyan Gradient -->
    <linearGradient id="neonPulse" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="32%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#2af575" />
    </linearGradient>

    <!-- Ambient Center Emerald Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1ed760" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Black Squircle Chassis -->
  <rect width="512" height="512" rx="128" fill="#090a0f" />
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- 5-Bar Harmonic Equalizer Riff (The Signature Soundwave) -->
  <rect x="103" y="202" width="46" height="108" rx="23" fill="url(#neonPulse)" />
  <rect x="168" y="146" width="46" height="220" rx="23" fill="url(#neonPulse)" />
  <rect x="233" y="96"  width="46" height="320" rx="23" fill="url(#neonPulse)" />
  <rect x="298" y="146" width="46" height="220" rx="23" fill="url(#neonPulse)" />
  <rect x="363" y="202" width="46" height="108" rx="23" fill="url(#neonPulse)" />
</svg>