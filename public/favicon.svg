<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep Obsidian Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141622" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Spotify Emerald & Electric Cyan Energy Gradient -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="60%" stop-color="#1db954" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Chamfered Edge Light Gradient -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Luminescent Neon Bloom -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Squircle Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#chassisGrad)" stroke="url(#edgeGrad)" stroke-width="1.5" />
  
  <!-- Subtle Internal Neon Edge Glow -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#1ed760" stroke-width="0.5" opacity="0.25" />

  <!-- Monogram R Core Geometry -->
  <g filter="url(#neonGlow)">
    <!-- 1. Pure White Vertical Stem Column -->
    <rect x="14" y="13" width="9" height="38" rx="2.5" fill="#ffffff" />

    <!-- 2. Pure White Upper Arch / Bowl -->
    <path
      d="M23 13 H37 C46 13 52 18 52 26 C52 34 46 39 37 39 H23 V13 Z"
      fill="#ffffff"
    />

    <!-- 3. Dark Inner Aperture Negative Space -->
    <path
      d="M23 20 H35.5 C39 20 42.5 22 42.5 26 C42.5 30 39 32 35.5 32 H23 V20 Z"
      fill="#08080a"
    />

    <!-- 4. Spotify Emerald Audio DSP Equalizer Pulse Bar -->
    <rect
      x="25"
      y="23.5"
      width="9"
      height="5"
      rx="2.5"
      fill="url(#neonEmerald)"
    />

    <!-- 5. 45-degree Forward Kinetic Leg -->
    <polygon
      points="27,37 36,37 50,51 40,51"
      fill="#ffffff"
    />

    <!-- 6. Electric Sonic Wave Frequency Indicator -->
    <circle
      cx="51"
      cy="26"
      r="3"
      fill="#1ed760"
    />
  </g>
</svg>
